<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>OneVibeMediaGroup — Partner Ecosystem</title>
    <meta
      name="description"
      content="The OneVibeMediaGroup partner ecosystem: partner marks orbiting the OVMG mark in three dimensions."
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #05070d;
        color: #d8dce2;
        font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
        overflow: hidden;
      }
      #hero3d-root {
        width: 100%;
        height: 100vh;
        height: 100svh;
      }
    </style>
  </head>
  <body>
    <!--
      Standalone hosted route. This is the iframe / Framer embed target:

        <iframe src="https://onevibemediagroup.com/hero3d/" style="width:100%;height:640px;border:0"
                title="OneVibeMediaGroup partner ecosystem" loading="lazy"></iframe>

      Options are read from data attributes, so nothing here needs rebuilding
      to change behaviour. See docs/INTEGRATION.md.
    -->
    <div
      id="hero3d-root"
      data-hero-height="100%"
      data-hero-background="dark"
      data-hero-layout="full-bleed"
    ></div>
    <script type="module" src="./hero3d.js"></script>
  </body>
</html>
